services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  metabase:
    image: metabase/metabase:v0.52.16
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - mb_data:/metabase-data
      - ./metabase/plugins/clickhouse.metabase-driver.jar:/plugins/clickhouse.metabase-driver.jar:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  ch_data:
  mb_data:
